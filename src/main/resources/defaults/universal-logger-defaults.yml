# Universal Logger - Default Configuration
# This file is bundled inside the JAR and provides default settings
# Projects only need to override specific values in their own universal-logger.yml

version: "1.0"

global:
  appName: "UniversalLogger"
  timezone: "Asia/Seoul"
  encoding: "UTF-8"

levels:
  root: "INFO"
  com.universallogger: "DEBUG"

sql:
  parameterSubstitution: false

outputs:
  # Console output - enabled by default
  console:
    enabled: true
    level: "INFO"
    format: "[{timestamp}] {level} - {logger} | {message}"
    colors:
      DEBUG: "cyan"
      INFO: "green"
      WARN: "yellow"
      ERROR: "red"

  # File output - enabled by default
  file:
    enabled: true
    level: "DEBUG"
    path: "C:/log/{appName}/application.log"
    format: "[{timestamp}] {level} - {logger} | {message}"
    rotation:
      maxSize: "50MB"
      maxFiles: 30
      compress: true

  # Error file - enabled by default
  error_file:
    enabled: true
    level: "ERROR"
    path: "C:/log/{appName}/error.log"
    format: "[{timestamp}] {level} - {logger} | {message} | {exception}"
    rotation:
      maxSize: "50MB"
      maxFiles: 30
      compress: true

  # Webhook - disabled by default
  webhook:
    enabled: false
    level: "ERROR"
    webhook:
      url: ""
      format: "🚨 *{level}* in {appName}\\n*Logger:* {logger}\\n*Message:* {message}"

  # Email - disabled by default
  email:
    enabled: false
    level: "ERROR"
    email:
      smtp:
        host: "smtp.gmail.com"
        port: 587
        username: ""
        password: ""
      to: []
      subject: "[{appName}] Error Alert"

  # Database - disabled by default
  database:
    enabled: false
    level: "INFO"
    database:
      type: "mysql"
      host: "localhost"
      port: 3306
      database: "logs"
      table: "app_logs"
      username: ""
      password: ""

# Sensitive data filters
filters:
  sensitiveData:
    enabled: true
    patterns:
      - regex: "password=\\w+"
        replace: "password=***"
      - regex: "token=\\w+"
        replace: "token=***"
      - regex: "\\d{4}-\\d{4}-\\d{4}-\\d{4}"
        replace: "****-****-****-****"

# Performance settings
performance:
  async: true
  bufferSize: 1000
  flushInterval: 5
  maxQueueSize: 10000
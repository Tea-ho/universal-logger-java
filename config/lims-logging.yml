# Universal Logger - LIMS 프로젝트 설정
# 기존 logback.xml을 YAML로 변환

version: "1.0"

global:
  appName: "bioChem"
  timezone: "Asia/Seoul"

# 로그 레벨 설정
levels:
  root: "INFO"
  lims: "DEBUG"    # lims 패키지는 DEBUG
  rdms: "DEBUG"    # rdms 패키지는 DEBUG

# 출력 설정
outputs:
  # 콘솔 출력
  console:
    enabled: true
    level: "DEBUG"
    format: "[{timestamp}] [{level}] [{thread}] [{logger}:{line}] - {message}"
    colors:
      DEBUG: "cyan"
      INFO: "green"
      WARN: "yellow"
      ERROR: "red"

  # 일반 로그 파일
  file:
    enabled: true
    level: "DEBUG"
    path: "C:/logs/Lims/{appName}_logs.{date}.log"
    format: "[{timestamp}] [{level}] [{thread}] [{logger}:{line}] - {message}"
    rotation:
      maxFileSize: "50MB"
      maxFiles: 30
      compress: true

  # 에러 전용 파일
  errorFile:
    enabled: true
    level: "ERROR"
    path: "C:/logs/Lims/error/{appName}_errlogs.{date}.log"
    format: "[{timestamp}] [{level}] [{thread}] [{logger}:{line}] - {message}"
    rotation:
      maxFileSize: "50MB"
      maxFiles: 30
      compress: true

  # 데이터베이스 로깅 (선택 사항)
  database:
    enabled: false  # 사용 시 true로 변경
    level: "INFO"
    database:
      type: "mysql"
      host: "localhost"
      port: 3306
      database: "lims_logs"
      table: "app_logs"
      username: "logger_user"
      password: "your_password"

# Universal Logger - 데이터베이스 설정 예시
# 지원 DB: MySQL, Oracle, MSSQL, PostgreSQL, H2

version: "1.0"

global:
  appName: "DBLoggerApp"

levels:
  root: "INFO"

outputs:
  console:
    enabled: true
    level: "INFO"

  # ===== MySQL 예시 =====
  database:
    enabled: false  # 사용 시 true로 변경
    level: "INFO"
    database:
      type: "mysql"
      host: "localhost"
      port: 3306  # 생략 시 기본값 사용
      database: "logs_db"
      table: "app_logs"
      username: "logger_user"
      password: "your_password"

  # ===== Oracle 예시 =====
  # database:
  #   enabled: true
  #   level: "INFO"
  #   database:
  #     type: "oracle"
  #     host: "localhost"
  #     port: 1521  # 생략 시 기본값 사용
  #     database: "ORCL"  # SID 또는 Service Name
  #     table: "app_logs"
  #     username: "logger_user"
  #     password: "your_password"

  # ===== MSSQL 예시 =====
  # database:
  #   enabled: true
  #   level: "INFO"
  #   database:
  #     type: "mssql"  # 또는 "sqlserver"
  #     host: "localhost"
  #     port: 1433  # 생략 시 기본값 사용
  #     database: "LogsDB"
  #     table: "app_logs"
  #     username: "sa"
  #     password: "your_password"

  # ===== PostgreSQL 예시 =====
  # database:
  #   enabled: true
  #   level: "INFO"
  #   database:
  #     type: "postgresql"  # 또는 "postgres"
  #     host: "localhost"
  #     port: 5432  # 생략 시 기본값 사용
  #     database: "logs_db"
  #     table: "app_logs"
  #     username: "postgres"
  #     password: "your_password"

  # ===== H2 (테스트용) 예시 =====
  # database:
  #   enabled: true
  #   level: "INFO"
  #   database:
  #     type: "h2"
  #     host: "file"  # "file" 또는 "memory"
  #     database: "testdb"
  #     table: "app_logs"
  #     username: "sa"
  #     password: ""
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.universallogger'
version = '1.0.0-java11'
sourceCompatibility = '11'
targetCompatibility = '11'

repositories {
    mavenCentral()
}

dependencies {
    // SLF4J API
    api 'org.slf4j:slf4j-api:1.7.36'

    // Logback (SLF4J 구현체)
    implementation 'ch.qos.logback:logback-classic:1.2.12'

    // YAML 파싱
    implementation 'org.yaml:snakeyaml:2.0'

    // JSON 파싱
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.15.2'

    // HTTP 클라이언트 (웹훅용)
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'

    // 이메일 발송
    implementation 'javax.mail:mail:1.4.7'

    // MySQL 드라이버 (optional)
    compileOnly 'mysql:mysql-connector-java:8.0.33'

    // Spring Boot (optional, for auto-configuration)
    compileOnly 'org.springframework.boot:spring-boot-starter:2.7.18'
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure:2.7.18'
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'

    // 테스트
    testImplementation 'junit:junit:4.13.2'
}

jar {
    manifest {
        attributes(
            'Implementation-Title': project.name,
            'Implementation-Version': project.version
        )
    }
}

// Fat JAR 생성 (모든 의존성 포함)
shadowJar {
    archiveClassifier.set('')

    // 메타 정보 충돌 방지
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'

    // 패키지 재배치 (충돌 방지)
    relocate 'org.apache.http', 'com.universallogger.shaded.apache.http'
    relocate 'org.yaml.snakeyaml', 'com.universallogger.shaded.snakeyaml'
    relocate 'com.fasterxml.jackson', 'com.universallogger.shaded.jackson'
}

// 소스 JAR 생성
task sourcesJar(type: Jar) {
    from sourceSets.main.allSource
    archiveClassifier.set('sources')
}

// JavaDoc JAR 생성
task javadocJar(type: Jar) {
    from javadoc
    archiveClassifier.set('javadoc')
}

artifacts {
    archives sourcesJar
    archives javadocJar
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifact sourcesJar
            artifact javadocJar
        }
    }
}

// 기본 빌드 태스크
build {
    dependsOn shadowJar
}

compileJava {
    options.encoding = 'UTF-8'
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

javadoc {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
}